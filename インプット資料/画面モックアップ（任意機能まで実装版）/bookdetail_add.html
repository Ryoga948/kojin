<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>書籍詳細追加</title>
    <!-- CSS読み込み -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>

<body>
    <!-- ヘッダー -->
    <div class="header">
        <h2><a href="main.html">Book</a></h2>
    </div>
    <!-- レイアウト -->
    <div class="content">
        <!-- サイドバー -->
        <div class="sidebar">
            <!-- メニュー-->
            <div class="list-group">
                <h5>会員管理</h5>
                <a class="list-group-item list-group-item-action" href="member_list.html">会員一覧</a>
                <a class="list-group-item list-group-item-action" href="member_add.html">会員登録</a>
                <br>
                <h5>書籍管理</h5>
                <a class="list-group-item list-group-item-action" href="book_list.html">書籍一覧</a>
                <a class="list-group-item list-group-item-action" href="book_add.html">書籍登録</a>
                <a class="list-group-item list-group-item-action" href="lend_list.html">貸出一覧</a>
                <br>
                <a class="list-group-item list-group-item-action" href="login.html">ログアウト</a>
            </div>
        </div>

        <!-- メイン -->
        <div class="main">
            <h3>書籍詳細追加</h3>
            <!-- フォーム -->
            <form action="book_detail.html" method="post">
                <input type="hidden" id="id" name="id" value="1">
                <label for="isbn">ISBN</label>
                <p id="isbn">978-4-7981-6364-0</p>
                <label for="name">書籍名</label>
                <p id="name">人生を盛り上げるための11のレッスン</p>
                <label for="start_at">入荷年月日</label>
                <input type="date" class="form-control is-invalid" id="start_at" name="start_at" value="">
                <div class="invalid-feedback">入荷年月日を入力してください。</div>
                <label for="start_at">備考</label>
                <input type="text" class="form-control" id="memo" name="memo" value="">
                <br>
                <input type="submit" value="追加" class="btn btn-primary">
            </form>
        </div>
    </div>
    <!-- フッター -->
    <div class="footer">
        <span>Copyright(C)2024 CTC Technology Corporation. All rights reserved.</span>
    </div>
</body>

</html>
